name: Build & Publish Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Artifacts to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true

      - name: Upload Build Artifacts (on manual run)
        uses: actions/upload-artifact@v4
        with:
          name: KRZ-PRINT-POS-Windows-Installers
          path: dist/*.exe
